<title>PRESENT App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: just the phone (402 × 874), centered on a plain white page. On a real phone the app fills the screen. */
:root {
  /* the app (single light look, as designed) */
  --teal: #17808A; --teal-dark: #0F5C63; --teal-deep: #0B4A50; --teal-light: #5FC3CA;
  --ink: #1E2A3B; --ink2: #2E3D4D; --muted: #5A6B78;
  --mist: #F4FAFA; --line: #D3E6E8; --line2: #E1EEEF; --aqua: #D5EEF0; --hero: #CFE9EB;
  --peach: #FDEBD3; --peach-light: #FFF6EA; --amber: #A35A0C; --amber-dark: #8A4B0C; --amber-text: #6B3A08; --amber-bar: #E2A866;
  --white: #FFFFFF; --navy2: #33465C; --navy-text: #C7D3DE; --scrim: rgba(11, 20, 28, .45);
  --display: 'Urbanist', 'Avenir Next', 'Helvetica Neue', sans-serif;
  --body: 'Open Sans', 'Segoe UI', 'Helvetica Neue', sans-serif;
}

html, body { height: 100%; }
body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--body); }
#root { height: 100%; }
.page { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
.device-slot { flex: none; position: relative; }
.bezel { box-sizing: border-box; position: absolute; left: 0; top: 0; width: 426px; height: 898px; padding: 12px; border-radius: 60px; background: #10161B; box-shadow: 0 30px 60px -20px rgba(16, 30, 40, .45), inset 0 0 0 2px #2A333B; transform-origin: top left; }
.device { position: relative; width: 402px; height: 874px; border-radius: 48px; overflow: hidden; background: var(--white); color: var(--ink); font-family: var(--body); font-size: 14px; isolation: isolate; }
.device *, .device *::before, .device *::after { box-sizing: border-box; }
/* On a real phone the app fills the screen, no frame. */
.phone-full { position: fixed; inset: 0; background: var(--white); }
.phone-full .device { width: 100%; height: 100%; border-radius: 0; }
/* On a real phone: the system draws the status bar and home indicator, so swap the drawn-in spacing for the safe areas,
   and keep text fields at 16px so iOS doesn't zoom in when one is focused. */
.phone-full .header { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.phone-full .footer { padding-bottom: max(16px, calc(8px + env(safe-area-inset-bottom, 0px))); }
.phone-full .tabbar { height: auto; min-height: 66px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.phone-full .sheet { padding-bottom: max(24px, calc(12px + env(safe-area-inset-bottom, 0px))); }
.phone-full input, .phone-full textarea, .phone-full select { font-size: 16px; }
html:has(.phone-full), body:has(.phone-full) { overflow: hidden; overscroll-behavior: none; }
.device button { font: inherit; color: inherit; cursor: pointer; }
.device :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.device p, .device h1, .device h2, .device dl, .device dd, .device ol, .device ul, .device fieldset { margin: 0; }

/* ---- screen structure ---- */
.stage { position: absolute; inset: 0; }
.stage.push { animation: push .28s ease-out; } .stage.pop { animation: pop .24s ease-out; } .stage.fade { animation: fade .2s ease-out; }
@keyframes push { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateX(-30px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stage, .sheet, .toast { animation: none !important; } }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--white); }
.header { padding: 56px 24px 12px; display: flex; flex-direction: column; gap: 16px; flex: none; }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.header-title { font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; }
.spacer44 { width: 44px; height: 44px; flex: none; }
.body { flex: 1; overflow-y: auto; padding: 8px 24px 24px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.footer { flex: none; padding: 12px 24px 30px; display: flex; flex-direction: column; gap: 8px; align-items: center; background: linear-gradient(rgba(255,255,255,0), var(--white) 14px); }
.tabbar { flex: none; height: 84px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--mist); border-top: 1px solid var(--line); padding-bottom: 18px; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--muted); }
.tabbar button.on { color: var(--teal); font-weight: 600; }

/* ---- layout helpers ---- */
.stack { display: flex; flex-direction: column; gap: 20px; }
.stack-4 { display: flex; flex-direction: column; gap: 4px; } .stack-6 { display: flex; flex-direction: column; gap: 6px; }
.stack-8 { display: flex; flex-direction: column; gap: 8px; } .stack-10 { display: flex; flex-direction: column; gap: 10px; } .stack-12 { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; } .row.between { justify-content: space-between; gap: 10px; } .row.baseline { align-items: baseline; } .row.top { align-items: flex-start; }
.gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-14 { gap: 14px; }
.grow { flex: 1; min-width: 0; } .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.block { display: block; } .left { text-align: left; } .center { text-align: center; } .px-4 { padding: 0 4px; }

/* ---- type ---- */
.title { font: 700 29px/1.12 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.em { color: var(--teal); }
.sub { font-size: 14px; line-height: 1.45; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.eyebrow.amber { color: var(--amber-dark); }
.label { font-size: 13px; font-weight: 600; } .label.teal, .teal { color: var(--teal); } .label.amber { color: var(--amber); }
.small { font-size: 13px; line-height: 1.45; } .xs { font-size: 12px; line-height: 1.4; } .xxs { font-size: 11px; line-height: 1.3; }
.muted { color: var(--muted); } .strong { font-weight: 600; } .lg { font-size: 18px; } .op { opacity: .82; }
.amber-text { color: var(--amber); }
.fine { font-size: 12px; color: var(--muted); text-align: center; }
.display { font: 700 32px/1 var(--display); letter-spacing: -.02em; }
.display-xl { font: 700 34px/1.08 var(--display); letter-spacing: -.02em; }
.lede { font-size: 16px; line-height: 1.5; color: var(--muted); }
.quote { font-style: italic; font-size: 14px; line-height: 1.5; color: var(--ink2); }
.plan-name { font: 700 21px/1.15 var(--display); color: var(--teal-dark); } .plan-name.light { color: var(--white); }
.unit { font-size: 12px; font-weight: 400; color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }

/* ---- controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 22px; border-radius: 28px; border: 0; font-weight: 600 !important; font-size: 16px !important; white-space: nowrap; }
.btn.full { width: 100%; }
.btn.primary { background: var(--teal); color: var(--white) !important; text-transform: capitalize; }
.addr { position: relative; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--mist); color: var(--muted); }
.addr:focus-within { border-color: var(--teal); }
.addr input { flex: 1; min-width: 0; height: 100%; border: 0 !important; background: none !important; padding: 0 !important; font: 16px var(--body); color: var(--ink); outline: none; }
.addr-list { list-style: none; margin: 4px 0 0; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); box-shadow: 0 12px 28px -14px rgba(30, 42, 59, .35); }
.addr-list button { width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
.addr-list button:hover, .addr-list button:focus-visible { background: var(--mist); }
.addr-list span { font-size: 12px; color: var(--muted); }
.addr-picked { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--teal-dark); font-weight: 600; }
.mini-input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--mist); font: 15px var(--body); color: var(--ink); }
.empty-line { font-size: 13px; color: var(--muted); padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--line); }
.btn.primary:disabled { background: #9DC9CD; cursor: default; }
.btn.ghost { background: none; height: 44px; font-weight: 500 !important; font-size: 15px !important; }
.btn.soft { background: var(--mist); border: 1px solid var(--line); color: var(--ink); }
.btn.amber { background: var(--amber); color: var(--white) !important; }
.btn.white { background: var(--white); color: var(--ink) !important; }
.btn.sm { height: 40px; padding: 0 16px; border-radius: 20px; font-size: 14px !important; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: var(--mist); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn.saved { color: var(--teal); }
.add-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px 6px 10px; border-radius: 999px; border: 0; background: var(--aqua); color: var(--teal-dark) !important; font-size: 13px !important; font-weight: 600 !important; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px !important; font-weight: 500; }
.pill.on { background: var(--ink); border-color: var(--ink); color: var(--white) !important; }
.chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--mist); font-size: 14px !important; }
.chip.on { border: 1.5px solid var(--teal); background: var(--aqua); color: var(--teal-dark) !important; font-weight: 600; }
.tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-left: 6px; white-space: nowrap; }
.tag.teal { background: var(--aqua); color: var(--teal-dark); } .tag.amber { background: var(--peach); color: var(--amber-dark); }
.row > .tag:first-child, .wrap > .tag, .done-body > .tag, .row.between > .tag { margin-left: 0; }
.avatar { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; color: var(--white); font: 700 16px var(--display); }
.switch { width: 51px; height: 31px; flex: none; border-radius: 16px; border: 0; background: var(--line); position: relative; transition: background .15s; }
.switch span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s; }
.switch.on { background: var(--teal); } .switch.on span { left: 22px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv span:first-child { color: var(--muted); } .kv span:last-child { font-weight: 600; text-align: right; }
.kv.strong { font-size: 16px; } .kv.strong span { color: var(--ink); font-weight: 700; }
.meter { height: 6px; border-radius: 3px; background: var(--peach); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 3px; background: var(--amber); }
.meter.teal { background: var(--aqua); } .meter.teal span { background: var(--teal); }
.meter.light { background: var(--navy2); } .meter.light span { background: var(--teal-light); }
.stepbar { display: grid; gap: 6px; }
.stepbar span { height: 4px; border-radius: 2px; background: var(--line); } .stepbar span.on { background: var(--teal); }
.link { background: none; border: 0; padding: 4px 0; color: var(--teal) !important; font-size: 13px !important; font-weight: 600 !important; }
.link.amber { color: var(--amber) !important; } .link.light { color: var(--teal-light) !important; font-size: 12px !important; }
.filter-btn { height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid var(--line); background: var(--mist); font-size: 14px !important; font-weight: 500; flex: none; }
.pill.removable { padding-right: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; }
.field > span, .field > legend { font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 0; }
.field > legend { margin-bottom: 8px; }
.field input, .field textarea { font: 16px/1.45 var(--body); color: var(--ink); background: var(--mist); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; width: 100%; resize: none; }
.field input { height: 48px; }
input[type=range] { width: 100%; accent-color: var(--teal); }
.option { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--white); text-align: left; }
.option.on { border: 2px solid var(--teal); background: var(--mist); padding: 11px 13px; }
.option:disabled { opacity: .55; cursor: default; }
.option.dashed { border: 1.5px dashed #A9C7CB; }
.check-dot { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--teal); color: var(--white); display: inline-flex; align-items: center; justify-content: center; }
.choice { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--mist); text-align: left; }
.choice.sub { align-items: stretch; background: var(--white); } .choice.sub.on { border: 2px solid var(--teal); background: var(--mist); padding: 11px 13px; }
.choice-empty { width: 56px; height: 56px; flex: none; border-radius: 14px; border: 1.5px dashed #A9C7CB; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.choice-empty.sm { width: 44px; height: 44px; border-radius: 12px; }
.plus-circle { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--aqua); color: var(--teal-dark); display: inline-flex; align-items: center; justify-content: center; }
.icon-tile { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--aqua); color: var(--teal-dark); display: inline-flex; align-items: center; justify-content: center; }
.icon-tile.peach { background: var(--peach); color: var(--amber); }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--mist); font-size: 13.5px; line-height: 1.45; color: var(--ink2); }
.note.peach { background: var(--peach); color: var(--amber-dark); } .note.amber { background: var(--peach-light); border: 1px solid var(--amber-bar); color: var(--amber-dark); }
.note.dont { display: flex; flex-direction: column; gap: 6px; color: var(--amber-text); }
.panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 12px; text-align: center; color: var(--muted); }
.ticks { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink2); }
.ticks li::before { content: '✓'; color: var(--amber); font-weight: 700; margin-right: 8px; }

/* ---- companions ---- */
.idcard { position: relative; width: 100%; display: flex; gap: 14px; padding: 12px; border-radius: 20px; background: var(--mist); border: 1px solid var(--line2); text-align: left; }
.idcard-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.idname { font-size: 17px; }
.facts { display: grid; grid-template-columns: 56px 1fr; row-gap: 3px; font-size: 13px; }
.facts dt { color: var(--muted); font-size: 12px; } .facts dd { font-weight: 500; }
.idfoot { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.idfoot.amber { color: var(--amber); } .idfoot.muted { color: var(--muted); } .idfoot.teal { color: var(--teal); }
.designated-badge { position: absolute; left: 18px; top: 104px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--teal); color: var(--white); font-size: 10.5px; font-weight: 700; letter-spacing: .03em; }
.profile-hero { position: relative; height: 270px; background: var(--hero); overflow: hidden; }
.profile-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
.profile-sheet { position: relative; margin-top: -24px; border-radius: 24px 24px 0 0; background: var(--white); padding: 20px 24px 12px; gap: 16px !important; }
.persona { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--mist); border: 1px solid var(--line); }
.booktag { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.booktag.yes { background: var(--aqua); color: var(--teal-dark); } .booktag.no { background: var(--mist); border: 1px solid var(--line); color: var(--muted); }

/* ---- memory kit ---- */
.storage { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--mist); }
.storage.full { background: var(--peach-light); border-color: var(--amber-bar); color: var(--amber-dark); }
.photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.add-tile { aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed #A9C7CB; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--teal-dark) !important; font-size: 11px !important; font-weight: 600 !important; }
.memory { padding: 14px 16px; border-radius: 14px; background: var(--mist); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.memory p { font-size: 13px; line-height: 1.45; color: var(--muted); }

/* ---- plans ---- */
.price-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.price-row { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 2px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.price-row dt { font-size: 14px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.price-row dt .tag { margin-left: 0; padding: 2px 8px; font-size: 11px; }
.price-row .price { font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.price-row .desc { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.plan-box { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--mist); border: 2px solid var(--teal); }
.plan-box.amber { border-color: var(--amber); background: var(--peach-light); }
.pay-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); }

/* ---- done screens ---- */
.done .body { display: flex; }
.done-body { margin: auto 0; display: flex; flex-direction: column; gap: 16px; padding: 0 4px; }
.done-body > .tag { align-self: flex-start; }
.done-mark { width: 88px; height: 88px; border-radius: 50%; background: var(--aqua); color: var(--teal); display: inline-flex; align-items: center; justify-content: center; }
.done-mark.hook { width: 104px; height: 104px; }
.done-mark.hook svg { animation: dangle 2.4s ease-in-out infinite; transform-origin: 62% 8%; }
@keyframes dangle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .done-mark.hook svg { animation: none; } }

/* ---- welcome ---- */
.welcome-hero { height: 470px; border-radius: 0 0 40px 40px; overflow: hidden; background: var(--hero); }
.welcome-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.welcome-copy { padding: 32px 28px 0; display: flex; flex-direction: column; gap: 14px; }
.welcome-copy h1 { font: 700 24px/1.08 var(--display); letter-spacing: -.02em; }
.so-why { font-size: 36px; font-weight: 700; color: var(--teal); line-height: 1.1; }
.welcome .lede { font-size: 16px; }

/* ---- home ---- */
.wordmark { font: 700 20px var(--display); letter-spacing: .12em; color: var(--teal); }
.patient-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--mist); font-size: 12.5px !important; font-weight: 600 !important; }
.bell { position: relative; } .bell i { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); border: 2px solid var(--mist); }
.report { border-radius: 24px; background: var(--mist); overflow: hidden; }
.report > img { width: 100%; height: 140px; object-fit: cover; display: block; }
.report-body { padding: 16px; }
.report-quote { font: 600 17px/1.35 var(--display); color: var(--ink2); }
.who-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--teal) !important; font-size: 12.5px !important; font-weight: 600 !important; }
.trends { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trend { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; }
.trend strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.trend.peach { background: var(--peach); color: var(--amber-dark); } .trend.peach strong { color: #7A3F06; }
.trend.aqua { background: var(--aqua); color: var(--teal-dark); } .trend.aqua strong { color: var(--teal-deep); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 28px; } .bars i { flex: 1; border-radius: 2px; background: var(--amber-bar); }
.dots { display: flex; gap: 4px; height: 28px; align-items: center; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); } .dots i.miss { background: var(--line); }
.next-visit { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; border: 0; background: var(--ink); color: var(--white) !important; text-align: left; }
.next-visit.light { background: var(--mist); border: 1px solid var(--line2); color: var(--ink) !important; }
.date-tile { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--navy2); color: var(--white); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; line-height: 1; }
.date-tile small { font-size: 10px; letter-spacing: .06em; font-weight: 400; margin-bottom: 2px; }
.next-visit.light .date-tile, .date-tile.soft { background: var(--aqua); color: var(--teal-deep); }
.suggest { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; border: 1px solid var(--line); }

/* ---- memories & account ---- */
.kit-card { padding: 16px; border-radius: 18px; background: var(--ink); color: var(--white); }
.kit-card .warn { color: var(--amber-bar); }
.diary { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line2); }
.avatars { display: inline-flex; } .avatars .avatar + .avatar { margin-left: -10px; }
.sub-card { padding: 18px; border-radius: 20px; background: var(--ink); color: var(--white); }
.sub-card .unit { color: var(--navy-text); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; }
.stat strong { font-size: 20px; } .stat.aqua { background: var(--aqua); color: var(--teal-deep); } .stat.peach { background: var(--peach); color: var(--amber-dark); } .stat.mist { background: var(--mist); color: var(--ink); }
.list { border: 1px solid var(--line2); border-radius: 16px; overflow: hidden; }
.list button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line2); background: var(--white); text-align: left; font-size: 15px !important; font-weight: 500; }
.list button:last-child { border-bottom: 0; }
.notif { width: 100%; display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line2); background: var(--white); text-align: left; }
.notif.unread { background: var(--mist); }

/* ---- new visit: calendar + day view ---- */
.calendar { border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-nav { width: 36px; height: 36px; border-radius: 18px; border: 0; background: var(--mist); display: inline-flex; align-items: center; justify-content: center; }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-dow { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.cal-day { position: relative; height: 40px; border-radius: 12px; border: 0; background: none; font-size: 14px !important; font-weight: 500; font-variant-numeric: tabular-nums; }
.cal-day:disabled { color: #B5C3C8 !important; cursor: default; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--teal); }
.cal-day.on { background: var(--teal); color: var(--white) !important; font-weight: 700; }
.cal-dots { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; gap: 3px; }
.cal-dots i, .cal-legend i { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
i.teal { background: var(--teal); } i.gray { background: #8C9AA3; } .cal-day.on .cal-dots i { background: var(--white); }
.cal-legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); padding: 2px 4px 0; }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; } .cal-legend i.ring { width: 9px; height: 9px; box-shadow: inset 0 0 0 1.5px var(--teal); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 12px; background: var(--mist); border: 1px solid var(--line); }
.seg button { height: 36px; border: 0; border-radius: 9px; background: none; font-size: 13px !important; font-weight: 500; }
.seg.mini { grid-template-columns: auto auto; padding: 2px; border-radius: 10px; }
.seg.mini button { height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px !important; }
.more-toggle { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; border: 0; background: none; color: var(--teal) !important; font-size: 13.5px !important; font-weight: 600 !important; }
.more-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.option.sub-offer { background: var(--peach-light); border-color: var(--amber-bar); }
.seg button.on { background: var(--white); box-shadow: 0 1px 3px rgba(30, 42, 59, .15); font-weight: 600; color: var(--teal-dark) !important; }
.dayview { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.slot { width: 100%; height: 44px; display: grid; grid-template-columns: 58px 1fr; align-items: stretch; border: 0; border-bottom: 1px solid var(--line2); background: var(--white); text-align: left; padding: 0; }
.slot:last-child { border-bottom: 0; }
.slot-time { font-size: 12px; color: var(--muted); padding: 6px 0 0 12px; font-variant-numeric: tabular-nums; }
.slot-lane { position: relative; padding: 4px 8px 4px 0; display: flex; align-items: stretch; }

.slot:not(.off):not(.on):hover .slot-lane { background: var(--mist); }
.slot.on { background: var(--aqua); border-bottom-color: var(--aqua); } .slot.on .slot-time { color: var(--teal-dark); font-weight: 600; }

.match-meter span { display: block; height: 100%; background: var(--teal); border-radius: 4px; transition: width .18s; }
.match-steps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); }
.match-steps li { display: flex; align-items: center; gap: 10px; }
.match-steps .dot { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; }

.match-steps li.done { color: var(--ink); } .match-steps li.done .dot { background: var(--teal); border-color: var(--teal); color: var(--white); }

.check-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 14px; cursor: pointer; }

.check-row input:focus-visible + .box { outline: 2px solid var(--teal); outline-offset: 2px; }

.screen.camera .icon-btn { background: var(--navy2); color: var(--white); } .screen.camera .header-title { color: var(--navy-text); }

.viewfinder { width: 300px; height: 380px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 2px var(--white); }
.viewfinder img { width: 100%; height: 100%; object-fit: cover; display: block; }

.shutter span { width: 58px; height: 58px; border-radius: 50%; background: var(--white); }
.gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .gen-grid img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; display: block; }

/* ---- sheets & toast ---- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; border: 0; background: var(--scrim); animation: fade .2s; }

@keyframes rise { from { transform: translateY(40px); opacity: .3; } to { transform: none; opacity: 1; } }

.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font: 700 23px/1.15 var(--display); letter-spacing: -.02em; }
